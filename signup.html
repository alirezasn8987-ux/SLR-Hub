<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام | SPH SHOP</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111827;
            color: white;
            font-family: sans-serif;
        }

        .box {
            width: 90%;
            max-width: 400px;
            background: #1f2937;
            padding: 25px;
            border-radius: 18px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin: 8px 0;
            border: none;
            border-radius: 10px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>ثبت‌نام در SPH SHOP</h1>

    <input
        id="email"
        type="email"
        placeholder="ایمیل"
        autocomplete="email"
    >

    <input
        id="password"
        type="password"
        placeholder="رمز عبور"
        autocomplete="new-password"
    >

    <button id="signupButton">
        ثبت‌نام
    </button>

    <div id="message"></div>

</div>

<script>

const SUPABASE_URL =
    "https://kgjiviwwwrkwzpmektoh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_inLD9v_USGu93C3-JwZ7CA_mLnNBFUw";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


document
    .getElementById("signupButton")
    .addEventListener("click", async function () {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");


        if (!email || !password) {

            message.textContent =
                "ایمیل و رمز عبور را وارد کن.";

            return;
        }


        if (password.length < 6) {

            message.textContent =
                "رمز عبور باید حداقل ۶ کاراکتر باشد.";

            return;
        }


        message.textContent =
            "در حال ساخت حساب...";


        const { data, error } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {
                    emailRedirectTo:
                        "https://alirezasn8987-ux.github.io/SLR-Hub/"
                }

            });


        if (error) {

            console.error(error);

            message.textContent =
                "خطا: " + error.message;

            return;
        }


        message.textContent =
            "ثبت‌نام انجام شد! 📧 ایمیل خودت را بررسی کن و حساب را تأیید کن.";

    });

</script>

</body>
</html>
