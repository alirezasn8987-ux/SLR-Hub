<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SPH SHOP</title>

    <link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

#authOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 2000;
    align-items: center;
    justify-content: center;
}

#authOverlay .form-box {
    width: 90%;
    max-width: 400px;
    padding: 25px;
    border-radius: 18px;
    background: #1f2937;
    color: white;
}

#authOverlay input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 7px 0;
    border-radius: 10px;
    border: none;
}


</style>

</head>

<body>

    <header class="header">

        <div class="logo">
            SPH SHOP
        </div>

        <button id="themeButton">☀️</button>
</header>


    <section class="hero">

        <h1>SPH SHOP</h1>

        <p>
            بازار خرید و فروش آیتم‌های Minecraft
        </p>

        <input
            type="text"
            id="search"
            placeholder="جستجوی آیتم..."
        >

    </section>


    <main class="shop">

        <h2 class="section-title">
            آگهی‌ها
        </h2>

        <div id="products" class="products">

            <div class="empty">
                هنوز آگهی‌ای ثبت نشده است.
            </div>

        </div>



    </main>


    <div id="formOverlay" class="overlay">

        <div class="form-box">

            <button id="closeForm" class="close-button">
                ×
            </button>

            <h2>
                ثبت آگهی
            </h2>

            <form id="itemForm">

                <label>
                    عکس آیتم
                    <span>(اختیاری)</span>
                </label>

                <input
                    type="file"
                    id="itemImage"
                    accept="image/*"
                >


                <label>
                    نام آیتم
                    <span>*</span>
                </label>

                <input
                    type="text"
                    id="itemName"
                    placeholder="نام آیتم"
                    required
                >


                <label>
                    توضیحات
                    <span>*</span>
                </label>

                <textarea
                    id="itemDescription"
                    placeholder="توضیحات آیتم"
                    required
                ></textarea>


                <label>
                    نام Minecraft فروشنده
                    <span>*</span>
                </label>

                <input
                    type="text"
                    id="sellerMinecraftName"
                    placeholder="نام شما در Minecraft را وارد کنید"
                    required
                >


                <label>
                    نوع ارزش
                    <span>*</span>
                </label>

                <select id="valueType" required>

                    <option value="">
                        انتخاب کنید
                    </option>

                    <option value="Ruby">
                        Ruby
                    </option>

                    <option value="Money">
                        Money
                    </option>

                </select>


                <label>
                    قیمت
                    <span>*</span>
                </label>

                <input
                    type="number"
                    id="itemPrice"
                    min="1"
                    placeholder="مثلاً 500"
                    required
                >


                <button
                    type="submit"
                    class="submit-button"
                >
                    ثبت آگهی
                </button>

            </form>

        </div>

    </div>


    <footer>

        SPH SHOP © 2026

    </footer>
<div id="bottomBar">

    <button id="messagesButton" title="پیام‌ها">
        💬
    </button>

    <button id="addAdButton" title="ثبت آگهی">
        +
    </button>

</div>

<div id="messagesOverlay" class="overlay">

    <div class="form-box messages-box">

        <button id="closeMessages" class="close-button">×</button>

        <h2>💬 پیام‌های من</h2>

        <div id="messagesList">

            <div class="empty">
                هنوز پیامی دریافت نکرده‌اید.
            </div>

        </div>

    </div>

</div>

<div id="listingOverlay" class="overlay">

    <div class="form-box listing-details-box">

        <button id="closeListing" class="close-button">×</button>

        <div id="listingDetails"></div>

    </div>

</div>

<div id="messageComposeOverlay" class="overlay">

    <div class="form-box">

        <button
            id="closeMessageCompose"
            class="close-button"
            type="button"
            onclick="document.getElementById('messageComposeOverlay').style.display='none'">
            ×
        </button>

        <h2>💬 پیام به فروشنده</h2>

        <textarea
            id="messageInput"
            placeholder="پیامتان را بنویسید..."
            rows="6"
        ></textarea>

        <button
            id="sendMessageButton"
            class="listing-message-button"
        >
            ارسال پیام
        </button>

    </div>

</div>

<script src="js/script.js"></script>

</body>

</html>
