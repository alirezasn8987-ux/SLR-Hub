<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SPH SHOP</title>

    <link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

    <header class="header">

        <div class="logo">
            SPH SHOP
        </div>

        <button id="themeButton">☀️</button>

    </header>


    <section class="hero">

        <h1>SPH SHOP</h1>

        <p>
            بازار خرید و فروش آیتم‌های Minecraft
        </p>

        <input
            type="text"
            id="search"
            placeholder="جستجوی آیتم..."
        >

    </section>


    <main class="shop">

        <h2 class="section-title">
            آگهی‌ها
        </h2>

        <div id="products" class="products">

            <div class="empty">
                هنوز آگهی‌ای ثبت نشده است.
            </div>

        </div>


        <div class="shop-actions">

            <button id="addButton" class="main-button">
                + ثبت آگهی
            </button>

            <button id="viewButton" class="second-button">
                مشاهده آگهی‌ها
            </button>

        </div>

    </main>


    <div id="formOverlay" class="overlay">

        <div class="form-box">

            <button id="closeForm" class="close-button">
                ×
            </button>

            <h2>
                ثبت آگهی
            </h2>

            <form id="itemForm">

                <label>
                    عکس آیتم
                    <span>(اختیاری)</span>
                </label>

                <input
                    type="file"
                    id="itemImage"
                    accept="image/*"
                >


                <label>
                    نام آیتم
                    <span>*</span>
                </label>

                <input
                    type="text"
                    id="itemName"
                    placeholder="نام آیتم"
                    required
                >


                <label>
                    توضیحات
                    <span>*</span>
                </label>

                <textarea
                    id="itemDescription"
                    placeholder="توضیحات آیتم"
                    required
                ></textarea>


                <label>
                    نوع ارزش
                    <span>*</span>
                </label>

                <select id="valueType" required>

                    <option value="">
                        انتخاب کنید
                    </option>

                    <option value="Ruby">
                        Ruby
                    </option>

                    <option value="Money">
                        Money
                    </option>

                </select>


                <label>
                    قیمت
                    <span>*</span>
                </label>

                <input
                    type="number"
                    id="itemPrice"
                    min="1"
                    placeholder="مثلاً 500"
                    required
                >


                <button
                    type="submit"
                    class="submit-button"
                >
                    ثبت آگهی
                </button>

            </form>

        </div>

    </div>


    <footer>

        SPH SHOP © 2026

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
