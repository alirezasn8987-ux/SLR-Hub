<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SPH SHOP</title>

    <link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

    <header class="header">

        <div class="logo">
            SPH SHOP
        </div>

        <button id="themeButton">☀️</button>

    </header>


    <section class="hero">

        <h1>SPH SHOP</h1>

        <p>
            بازار خرید و فروش آیتم‌های Minecraft
        </p>

        <input
            type="text"
            id="search"
            placeholder="جستجوی آیتم..."
        >

    </section>


    <main class="shop">

        <h2 class="section-title">
            آگهی‌ها
        </h2>

        <div id="products" class="products">

            <div class="empty">
                هنوز آگهی‌ای ثبت نشده است.
            </div>

        </div>


        <div class="shop-actions">

            <button id="addButton" class="main-button">
                + ثبت آگهی
            </button>

            <button id="viewButton" class="second-button">
                مشاهده آگهی‌ها
            </button>

        </div>

    </main>


    <div id="formOverlay" class="overlay">

        <div class="form-box">

            <button id="closeForm" class="close-button">
                ×
            </button>

            <h2>
                ثبت آگهی
            </h2>

            <form id="itemForm">

                <label>
                    عکس آیتم
                    <span>(اختیاری)</span>
                </label>

                <input
                    type="file"
                    id="itemImage"
                    accept="image/*"
                >


                <label>
                    نام آیتم
                    <span>*</span>
                </label>

                <input
                    type="text"
                    id="itemName"
                    placeholder="نام آیتم"
                    required
                >


                <label>
                    توضیحات
                    <span>*</span>
                </label>

                <textarea
                    id="itemDescription"
                    placeholder="توضیحات آیتم"
                    required
                ></textarea>


                <label>
                    نوع ارزش
                    <span>*</span>
                </label>

                <select id="valueType" required>

                    <option value="">
                        انتخاب کنید
                    </option>

                    <option value="Ruby">
                        Ruby
                    </option>

                    <option value="Money">
                        Money
                    </option>

                </select>


                <label>
                    قیمت
                    <span>*</span>
                </label>

                <input
                    type="number"
                    id="itemPrice"
                    min="1"
                    placeholder="مثلاً 500"
                    required
                >


                <button
                    type="submit"
                    class="submit-button"
                >
                    ثبت آگهی
                </button>

            </form>

        </div>

    </div>


    <footer>

        SPH SHOP © 2026

    </footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/script.js"></script>

<div id="authBox">
    <h2>ثبت‌نام / ورود</h2>

    <input id="authEmail" type="email" placeholder="ایمیل">

    <input id="authPassword" type="password" placeholder="رمز عبور">

    <button id="signupBtn">ثبت‌نام</button>
    <button id="loginBtn">ورود</button>

    <p id="authMessage"></p>
</div>

<style>
#authBox {
    max-width: 400px;
    margin: 30px auto;
    padding: 20px;
    border-radius: 18px;
    background: #1f2937;
    color: white;
    text-align: center;
}

#authBox input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 7px 0;
    border-radius: 10px;
    border: none;
}

#authBox button {
    padding: 12px 20px;
    margin: 5px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}
</style>

<script>
const SUPABASE_URL = "https://kgjiviwwwrkwzpmektoh.supabase.co";
const SUPABASE_KEY = "sb_publishable_inLD9v_USGu93C3-JwZ7CA_mLnNBFUw";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

document.getElementById("signupBtn").addEventListener("click", async function () {

    const email = document.getElementById("authEmail").value.trim();
    const password = document.getElementById("authPassword").value;
    const message = document.getElementById("authMessage");

    if (!email || !password) {
        message.textContent = "ایمیل و رمز عبور را وارد کن.";
        return;
    }

    message.textContent = "در حال ثبت‌نام...";

    const { error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
            emailRedirectTo:
                "https://alirezasn8987-ux.github.io/SLR-Hub/"
        }
    });

    if (error) {
        message.textContent = "خطا: " + error.message;
        return;
    }

    message.textContent =
        "ثبت‌نام شد! 📧 ایمیلت رو بررسی کن و تأییدش کن.";
});
</script>

</body>

</html>
