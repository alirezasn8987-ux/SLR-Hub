<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SPH SHOP</title>

    <link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

#authOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 2000;
    align-items: center;
    justify-content: center;
}

#authOverlay .form-box {
    width: 90%;
    max-width: 400px;
    padding: 25px;
    border-radius: 18px;
    background: #1f2937;
    color: white;
}

#authOverlay input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 7px 0;
    border-radius: 10px;
    border: none;
}

#menuButton {
    font-size: 28px;
    background: none;
    border: none;
    cursor: pointer;
    color: inherit;
}

#menuBox {
    display: none;
    position: absolute;
    top: 60px;
    right: 10px;
    background: #1f2937;
    padding: 10px;
    border-radius: 12px;
    z-index: 1000;
}

#menuBox button {
    display: block;
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

</style>

</head>

<body>

    <header class="header">

        <div class="logo">
            SPH SHOP
        </div>

        <button id="themeButton">☀️</button>

        <button id="menuButton">⋮</button>

<div id="menuBox">
    <button id="loginMenu">ثبت‌نام / ورود</button>
    <button id="logoutMenu">خروج از حساب کاربری</button>
</div>

    </header>


    <section class="hero">

        <h1>SPH SHOP</h1>

        <p>
            بازار خرید و فروش آیتم‌های Minecraft
        </p>

        <input
            type="text"
            id="search"
            placeholder="جستجوی آیتم..."
        >

    </section>


    <main class="shop">

        <h2 class="section-title">
            آگهی‌ها
        </h2>

        <div id="products" class="products">

            <div class="empty">
                هنوز آگهی‌ای ثبت نشده است.
            </div>

        </div>



    </main>


    <div id="formOverlay" class="overlay">

        <div class="form-box">

            <button id="closeForm" class="close-button">
                ×
            </button>

            <h2>
                ثبت آگهی
            </h2>

            <form id="itemForm">

                <label>
                    عکس آیتم
                    <span>(اختیاری)</span>
                </label>

                <input
                    type="file"
                    id="itemImage"
                    accept="image/*"
                >


                <label>
                    نام آیتم
                    <span>*</span>
                </label>

                <input
                    type="text"
                    id="itemName"
                    placeholder="نام آیتم"
                    required
                >


                <label>
                    توضیحات
                    <span>*</span>
                </label>

                <textarea
                    id="itemDescription"
                    placeholder="توضیحات آیتم"
                    required
                ></textarea>


                <label>
                    نوع ارزش
                    <span>*</span>
                </label>

                <select id="valueType" required>

                    <option value="">
                        انتخاب کنید
                    </option>

                    <option value="Ruby">
                        Ruby
                    </option>

                    <option value="Money">
                        Money
                    </option>

                </select>


                <label>
                    قیمت
                    <span>*</span>
                </label>

                <input
                    type="number"
                    id="itemPrice"
                    min="1"
                    placeholder="مثلاً 500"
                    required
                >


                <button
                    type="submit"
                    class="submit-button"
                >
                    ثبت آگهی
                </button>

            </form>

        </div>

    </div>


    <footer>

        SPH SHOP © 2026

    </footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script>
document.getElementById("menuButton").addEventListener("click", function () {
    const menu = document.getElementById("menuBox");

    if (menu.style.display === "block") {
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }
});
</script>

<div id="authOverlay" class="overlay">
    <div class="form-box">
        <button id="closeAuth" class="close-button">×</button>

        <h2>ثبت‌نام / ورود</h2>

        <input id="authEmail" type="email" placeholder="ایمیل">

        <input id="authPassword" type="password" placeholder="رمز عبور">

        <input id="gameUsername" type="text" placeholder="نام داخل بازی Minecraft">

        <button id="signupBtn" class="submit-button">
            ثبت‌نام
        </button>

        <button id="loginBtn" class="second-button">
            ورود
        </button>

        <p id="authMessage"></p>
    </div>
</div>

<script>
document.getElementById("loginMenu").addEventListener("click", function () {
    document.getElementById("authOverlay").style.display = "flex";
    document.getElementById("menuBox").style.display = "none";
});

document.getElementById("closeAuth").addEventListener("click", function () {
    document.getElementById("authOverlay").style.display = "none";
});
</script>


<div id="bottomBar">

    <button id="messagesButton" title="پیام‌ها">
        💬
    </button>

    <button id="addAdButton" title="ثبت آگهی">
        +
    </button>

</div>

<div id="messagesOverlay" class="overlay">

    <div class="form-box messages-box">

        <button id="closeMessages" class="close-button">×</button>

        <h2>💬 پیام‌های من</h2>

        <div id="messagesList">

            <div class="empty">
                هنوز پیامی دریافت نکرده‌اید.
            </div>

        </div>

    </div>

</div>

<script src="js/script.js"></script>

</body>

</html>
